plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

ext {
    javafxVersion = '21.0.1'
    // Default to current platform, can be overridden with -PjavafxPlatform=win|linux|mac
    javafxPlatform = project.hasProperty('javafxPlatform') ? project.property('javafxPlatform')
            : (org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'win'
            : (org.gradle.internal.os.OperatingSystem.current().isLinux() ? 'linux' : 'mac'))
    // By default, include ALL platforms for cross-platform distribution
    // Set -PjavafxPlatformOnly=true to build for current platform only
    includeAllPlatforms = !(project.hasProperty('javafxPlatformOnly') && project.property('javafxPlatformOnly').toBoolean())
}

dependencies {
    // Use platform-classified JavaFX artifacts: unclassified jars are metadata-only.
    // By default, include ALL platforms for cross-platform distribution.
    // Use -PjavafxPlatformOnly=true to build for current platform only.
    def platformsToInclude = includeAllPlatforms ? ['win', 'linux', 'mac'] : [javafxPlatform]
    
    for (platform in platformsToInclude) {
        implementation "org.openjfx:javafx-base:$javafxVersion:$platform"
        implementation "org.openjfx:javafx-graphics:$javafxVersion:$platform"
        implementation "org.openjfx:javafx-controls:$javafxVersion:$platform"
        implementation "org.openjfx:javafx-fxml:$javafxVersion:$platform"
    }

    // Test dependencies
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.10.0'
    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.10.0'

    // Mockito for mocking in unit tests
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.7.0'
}

checkstyle {
    toolVersion = '10.12.5'
    ignoreFailures = true
    configDirectory = layout.projectDirectory.dir('config/checkstyle')
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"

        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true
        showStandardStreams = false
    }
}

application {
    mainClass.set('Launcher')
    applicationDefaultJvmArgs = [
        '--module-path', sourceSets.main.runtimeClasspath.asPath,
        '--add-modules', 'javafx.base,javafx.graphics,javafx.controls,javafx.fxml'
    ]
}

shadowJar {
    archiveBaseName = "monday"
    archiveClassifier = null

    manifest {
        attributes 'Main-Class': 'Launcher'
    }
    
    // Merge service files for proper JavaFX native library loading
    mergeServiceFiles()
    
    // Java runtime will automatically select the correct native libraries based on OS and architecture.
    // This allows the JAR to work on Windows (x86_64), Linux (x86_64, ARM64), and Mac (x86_64, ARM64).
}

run {
    standardInput = System.in
    enableAssertions = true
    jvmArgs = [
        '--module-path', sourceSets.main.runtimeClasspath.asPath,
        '--add-modules', 'javafx.base,javafx.graphics,javafx.controls,javafx.fxml'
    ]
}

// Force JavaFX modules to be available during compilation
tasks.named('compileJava').configure {
    options.encoding = 'UTF-8'
}

javadoc {
    options.memberLevel = JavadocMemberLevel.PUBLIC
}

tasks.register('runTextUiTest', Exec) {
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        executable 'cmd'
        args '/c', 'text-ui-test\\runtest.bat'
    } else {
        executable 'bash'
        args 'text-ui-test/runtest.sh'
    }
}
